<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="12" viewBox="0 0 1200 12" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39D6FF" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#39D6FF"/>
      <stop offset="0.5" stop-color="#A58BFF"/>
      <stop offset="0.8" stop-color="#00D19A"/>
      <stop offset="1" stop-color="#00D19A" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .dot { animation: run 4s cubic-bezier(.45,0,.55,1) infinite; }
    @keyframes run { from { transform: translateX(0) } to { transform: translateX(1080px) } }
    @media (prefers-reduced-motion: reduce) { .dot { animation: none } }
  </style>
  <rect x="0" y="5" width="1200" height="2" rx="1" fill="url(#g)" opacity=".55"/>
  <circle class="dot" cx="60" cy="6" r="4" fill="#39D6FF"/>
</svg>
